# FastAPI项目配置模板
# 使用pydantic-settings进行配置管理

# 应用基础配置
app:
  name: "FastAPI Production Template"
  env: "development"  # development/staging/production
  root_path: "."      # 项目根路径

# 服务器配置
server:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  reload: true  # 开发环境启用热重载

# 日志配置
log:
  level: "INFO"              # debug/info/warn/error
  format: "json"             # json/text
  file: "./logs/app.log"     # 日志文件路径（为空则输出到控制台）
  output: "both"             # file/console/both
  max_size: 100              # 单个日志文件最大MB
  max_backups: 7             # 最多保留旧文件数
  max_age: 30                # 最多保留天数
  compress: true             # 是否压缩
  time_format: "%Y-%m-%d %H:%M:%S"  # 时间格式
  encoding: "utf-8"          # 日志文件编码

# 数据库配置（PostgreSQL）
database:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "CHANGEME"
  name: "template_db"
  pool_size: 10
  max_overflow: 20

# Redis配置
redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0

# JWT配置
jwt:
  secret: "CHANGEME"
  access_expire_minutes: 60
  refresh_expire_minutes: 10080  # 7天

# 跨域配置
cors:
  origins:
    - "http://localhost:3000"
    - "http://localhost:8000"
  allow_credentials: true
  allow_methods: ["*"]
  allow_headers: ["*"]

# 限流配置
rate_limit:
  default: "100/minute"