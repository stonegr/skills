# Go Gin项目配置模板
# 使用viper进行配置管理

# 应用基础配置
app:
  name: "template_go_gin"
  env: "dev"  # dev/test/prod
  root_path: "."  # 项目根路径

# 服务器配置
server:
  host: "0.0.0.0"
  port: 8080
  mode: "debug"  # debug/release
  read_header_timeout: 5s
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s

# 日志配置
log:
  level: "debug"              # debug/info/warn/error
  file: "./logs/app.log"      # 日志文件路径
  output: "both"              # file/console/both
  max_size: 100               # 单个日志文件最大MB
  max_backups: 7              # 最多保留旧文件数
  max_age: 30                 # 最多保留天数
  compress: true              # 是否压缩
  time_format: "2006-01-02 15:04:05"  # Go时间格式
  encoding: "utf-8"           # 日志文件编码

# 数据库配置（PostgreSQL）
database:
  driver: "postgres"  # postgres/sqlite/mysql
  host: "127.0.0.1"
  port: 5432
  user: "postgres"
  password: "CHANGEME"
  dbname: "template_db"
  sslmode: "disable"
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 1h
  conn_max_idle_time: 30m
  prepare_stmt: true

# Redis配置
redis:
  host: "127.0.0.1"
  port: 6379
  password: ""
  db: 0
  pool_size: 20

# JWT配置
jwt:
  secret: "CHANGEME"
  access_expire: 2h
  refresh_expire: 168h  # 7天
  issuer: "template_go_gin"