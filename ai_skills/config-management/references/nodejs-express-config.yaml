# Node.js Express项目配置模板
# 使用dotenv + convict进行配置管理

# 应用基础配置
app:
  name: "template_express"
  env: "development"  # development/staging/production
  root_path: "."  # 项目根路径

# 服务器配置
server:
  host: "0.0.0.0"
  port: 3000
  workers: 4

# 日志配置
log:
  level: "info"               # debug/info/warn/error
  format: "json"              # json/text
  file: "./logs/app.log"      # 日志文件路径（为空则输出到控制台）
  output: "both"              # file/console/both
  max_size: 10485760          # 单个日志文件最大字节（10MB）
  max_files: 5                # 最多保留文件数
  max_age: 30                 # 最多保留天数
  time_format: "YYYY-MM-DD HH:mm:ss"  # Moment.js时间格式
  encoding: "utf-8"           # 日志文件编码

# 数据库配置（PostgreSQL）
database:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "CHANGEME"
  name: "template_db"
  pool_size: 10

# Redis配置
redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0

# JWT配置
jwt:
  secret: "CHANGEME"
  access_expire: "1h"
  refresh_expire: "7d"