[project]
name = "skills"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "pandas>=2.3.3",
    "ruff>=0.16.2",
]

[tool.ruff]
# 目标 Python 版本
target-version = "py313"
# 最大行长度
line-length = 170

# 默认包含所有子目录的 .py 和 .pyi，通常不需要显式写 include
# exclude 保持原样即可，Ruff 默认也会忽略常见的目录
exclude = [
    ".git",
    ".ruff_cache",
    "__pycache__",
    "build",
    "dist",
    "venv",
    ".venv",
]

[tool.ruff.lint]
# 扩展选择的规则集
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (导入排序)
    "C4",  # flake8-comprehensions (列表推导式优化)
    "B",   # flake8-bugbear (常见代码陷阱)
    "Q",   # flake8-quotes (引号规范)
    "N",   # pep8-naming (命名规范)
    "UP",  # pyupgrade (自动升级新语法)
    "ANN", # flake8-annotations (类型注解)
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify (简化代码)
]

ignore = [
    "B008",   # 允许在函数参数中使用函数调用（FastAPI 依赖注入常用）
    "RUF", # 中文标点字符
    "D",      # 如果不需要强制写 docstring，可以忽略
    "ANN401", # any
    "ANN201", # return
    "ANN205", # return
]

# 允许自动修复
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
force-sort-within-sections = true
lines-after-imports = 2
combine-as-imports = true

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"
# 保持为 true，有助于减少 git diff 冲突
skip-magic-trailing-comma = false

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "double"
docstring-quotes = "double"

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true
suppress-none-returning = true
suppress-dummy-args = true

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["classmethod"]
staticmethod-decorators = ["staticmethod"]
